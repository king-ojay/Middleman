# Render Blueprint for the Middleman API (free web service).
# In Render: New + > Blueprint > pick this repo. MONGO_URI is prompted for
# at creation; secrets are generated by Render. Nothing secret is stored here.
services:
  - type: web
    name: middleman-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: MONGO_URI
        sync: false
      - key: NODE_ENV
        value: production
      # Pinned Node version (same as .nvmrc). Node 24 is the current LTS line.
      - key: NODE_VERSION
        value: 24.22.1
      # Browser origins allowed to call the API (comma-separated). Anything else gets 403.
      - key: CORS_ORIGINS
        value: https://middleman-client.vercel.app
      # Signs session tokens; the API refuses to start in production without it.
      - key: SESSION_SECRET
        generateValue: true
      - key: OTP_SECRET
        generateValue: true
      # console prints signup codes to the Render log; switch to twilio or
      # africastalking (and add their keys) to send real SMS.
      - key: OTP_PROVIDER
        value: console
