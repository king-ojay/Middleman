# Render Blueprint for the Middleman API (free web service).
# In Render: New + > Blueprint > pick this repo. MONGO_URI is prompted for
# at creation; secrets are generated by Render. Nothing secret is stored here.
services:
  - type: web
    name: middleman-api
    runtime: node
    plan: free
    rootDir: server
    # Deploy when the API or the shared lists change (paths from the repo
    # root). The build only sees server/: shared/ reaches it as committed
    # copies (npm run sync:shared), never by reading ../shared.
    buildFilter:
      paths:
        - server/**
        - shared/**
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: MONGO_URI
        sync: false
      - key: NODE_ENV
        value: production
      # Pinned Node version (same as .nvmrc). Node 24 is the current LTS line.
      - key: NODE_VERSION
        value: 24.22.1
      # Browser origins allowed to call the API (comma-separated). Anything else gets 403.
      - key: CORS_ORIGINS
        value: https://middleman-client.vercel.app
      # Signs session tokens; the API refuses to start in production without it.
      - key: SESSION_SECRET
        generateValue: true
      - key: OTP_SECRET
        generateValue: true
      # Set in the dashboard. console logs only a masked number in production
      # (codes are not logged); africastalking sends real SMS with the keys below.
      - key: OTP_PROVIDER
        sync: false
      - key: AT_USERNAME
        sync: false
      - key: AT_API_KEY
        sync: false
      - key: AT_SENDER_ID
        sync: false
      # Escrow, set in the dashboard: fake (the default when unset) moves no
      # money; momo-sandbox once the six MOMO_* keys below are set in Render
      # (never in this file). Sandbox only: the provider refuses any host but
      # sandbox.momodeveloper.mtn.com.
      - key: PAYMENT_PROVIDER
        sync: false
      # For momo-sandbox add (sync: false, values in Render only):
      #   MOMO_COLLECTION_SUBSCRIPTION_KEY, MOMO_COLLECTION_USER_ID, MOMO_COLLECTION_API_KEY,
      #   MOMO_DISBURSEMENT_SUBSCRIPTION_KEY, MOMO_DISBURSEMENT_USER_ID, MOMO_DISBURSEMENT_API_KEY,
      #   MOMO_CALLBACK_URL=https://middleman-api-74zb.onrender.com/api/payments/momo/callback
      # Shared secret for the dispute admin routes (X-Admin-Secret header).
      - key: ADMIN_SECRET
        generateValue: true
